name: Monitor - uptime and alerts

# Every 30 minutes. A failed run means something needs a look; GitHub emails a failed scheduled
# run to the person who last changed this file. Set the repository secret ALERT_SECRET (the same
# value as ALERT_SECRET in Vercel) to include the click-spike / abuse checks.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE: https://link.grabormiss.com
  ORIGIN: https://tiny-url-self.vercel.app
  BRIDGE: https://creataurus.work.gd

jobs:
  uptime:
    name: Site, origin, custom-domain bridge and MCP respond
    runs-on: ubuntu-latest
    steps:
      - name: Check endpoints
        run: |
          fail=0
          check() { # name url expected-status
            code=$(curl -s -o /dev/null -m 20 --retry 2 --retry-delay 5 -w '%{http_code}' "$2" || echo 000)
            if [ "$code" = "$3" ]; then echo "ok    $1 ($code)"; else echo "FAIL  $1: got $code, expected $3"; fail=1; fi
          }
          check "Platform domain"         "$SITE/"            200
          check "Vercel origin"           "$ORIGIN/"          200
          check "Caddy custom-domain edge" "$BRIDGE/"         200
          check "MCP server"              "$ORIGIN/api/mcp"   405
          exit $fail

  alerts:
    name: Click spikes, bots, rate limits, MCP errors
    runs-on: ubuntu-latest
    steps:
      - name: Ask the app
        env:
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
        run: |
          if [ -z "$ALERT_SECRET" ]; then echo "ALERT_SECRET not set; skipping."; exit 0; fi
          body=$(curl -s -m 30 -H "Authorization: Bearer $ALERT_SECRET" "$ORIGIN/api/v1/internal/alerts")
          echo "$body"
          echo "$body" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if not d.get('success'):
              print('::error::Alert check did not run:', d.get('error')); sys.exit(1)
          for a in d.get('alerts', []):
              print(f\"::{'error' if a['level'] == 'critical' else 'warning'}::[{a['check']}] {a['message']}\")
          sys.exit(0 if d.get('ok') else 1)
          "
