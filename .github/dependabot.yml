version: 2
updates:
  # Security and version updates for npm packages, opened as pull requests
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
